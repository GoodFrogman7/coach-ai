[pytest]
# Discover the repo's test_*.py files (kept at the project root).
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
norecursedirs = venv .venv .git outputs data models kb __pycache__ *.egg-info
addopts = -ra -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
