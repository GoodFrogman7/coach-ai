name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # mediapipe depends on the non-headless opencv wheel, which needs libGL.
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      # CPU-only torch is ~200 MB instead of ~2 GB with CUDA. Installing it first
      # means sentence-transformers and ultralytics reuse it. torchvision must
      # come from the same index or its ops fail to register against torch.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Fail loudly here rather than letting downstream scripts swallow an
      # ImportError into a "not installed" message.
      - name: Verify imports
        run: |
          pip freeze
          python -c "import mediapipe, cv2, sentence_transformers, ultralytics; print('imports ok')"

      # The RAG index artifacts are gitignored; rebuild them so retrieval tests
      # exercise the real ensemble path. The embedding model is cached between runs.
      - name: Cache sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Build RAG index
        run: |
          python rag/index_kb.py
          python rag/embedding_index.py

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q
